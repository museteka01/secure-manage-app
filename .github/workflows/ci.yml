name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-not-used-anywhere-else-0123456789
      DATABASE_URL: sqlite:///./ci.db

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 app tests

      - name: Security scan of the code (bandit)
        run: bandit -r app -ll

      - name: Scan dependencies for known CVEs (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Run tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-scan
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t secure-manage-app:${{ github.sha }} .
